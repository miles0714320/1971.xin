name: Deploy 1971.xin to Cloudflare Pages

# 说明：这不是 Cloudflare Pages 内置的 Git 集成（Direct Upload 项目无法启用那个），
# 而是由我们自己调用 wrangler 把文件点名上传到现有项目 1971-xin。
# 好处：自动部署 + 版本历史 + 分支预览，且不需要重建项目、不动 DNS。

on:
  push:
    branches:
      - main
  # 允许在 GitHub 网页上点一下手动发布，不必等 push
  workflow_dispatch:

# 连续 push 时取消上一次还没跑完的部署，避免旧版本后上线
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # 让 wrangler 在提交上显示部署状态
    steps:
      - uses: actions/checkout@v7

      - name: 一次性：把 Pages 项目的生产分支改为 main
        run: |
          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/d641996a2373c84db40e866c274aeb8e/pages/projects/1971-xin" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}'
          echo ""
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/d641996a2373c84db40e866c274aeb8e/pages/projects/1971-xin" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"

      - name: 上传到 Cloudflare Pages 生产环境
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 不传 --branch：wrangler 会直接发到生产分支。
          # 若传了 --branch=main 而 main 不是该项目的生产分支，
          # 部署只会进 main.1971-xin.pages.dev 预览地址，线上不会变。
          command: pages deploy . --project-name=1971-xin --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # token 还没配时，上面这步会失败（显示红色），属正常现象。
      # 配好一次之后就不会再失败：仓库 Settings → Secrets and variables → Actions
      # 新增 CLOUDFLARE_API_TOKEN，权限只需 Account → Cloudflare Pages → Edit。
