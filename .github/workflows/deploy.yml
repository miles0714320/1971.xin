name: Deploy 1971.xin to Cloudflare Pages

# 说明：本站是 Cloudflare Pages 的 Direct Upload 项目（无法用内置 Git 集成），
# 由我们自己跑 Astro 构建，再调 wrangler 把构建产物点名上传到现有项目 1971-xin。
# 每次 push 到 main：install → build → deploy，全程自动。

on:
  push:
    branches:
      - main
  # 允许在 GitHub 网页上点一下手动发布，不必等 push
  workflow_dispatch:

# 连续 push 时取消上一次还没跑完的部署，避免旧版本后上线
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # 让 wrangler 在提交上显示部署状态
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm # 依据 package-lock.json 提速

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build

      - name: 兜底检查
        run: |
          # 防止构建异常时把残缺产物传上线顶掉正常页面
          test -f dist/index.html || { echo "!! 缺少 dist/index.html，中止"; exit 1; }
          test -f dist/404.html || { echo "!! 缺少 dist/404.html，中止"; exit 1; }
          ls dist

      - name: 上传到 Cloudflare Pages 生产环境
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 不传 --branch：wrangler 会直接发到生产分支。
          # 产物在 dist/（.gitignore 已排除），CSS/JS 文件名自带内容哈希，天然破缓存。
          command: pages deploy dist --project-name=1971-xin --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
